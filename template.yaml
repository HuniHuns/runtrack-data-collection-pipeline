AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: >
  RUNTRACK Marathon 대회 데이터 수집 파이프라인을 위한
  AWS SAM 템플릿

## ===========================================================
## Parameters
## 계정 및 환경마다 달라지는 AWS 리소스 값을 외부에서 전달
## ===========================================================

Parameters:

  DbHost:
    Type: String
    Description: Amazon RDS MySQL Endpoint

  DbPort:
    Type: String
    Default: '3306'
    Description: Amazon RDS MySQL Port

  DbName:
    Type: String
    Description: Amazon RDS MySQL Database Name

  DbSecretArn:
    Type: String
    Description: Amazon RDS Managed Secrets Manager Secret ARN

  LoadSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: VPC Subnet ID for RUNTRACK Load Lambda

  LoadSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group ID for RUNTRACK Load Lambda


# ============================================================
# AWS Resources
# ============================================================

Resources:

  # ==========================================================
  # Data Pipeline S3 Bucket
  # ==========================================================

  DataBucket:
    Type: AWS::S3::Bucket

    Properties:

      # 외부 Public 접근 차단
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # ==========================================================
  # Extract Lambda
  # ==========================================================

  ExtractFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: runtrack-pipeline-extract

      PackageType: Image

      Architectures:
        - x86_64

      Description: >
        runfor.kr에서 마라톤 일정 데이터를 동적으로 수집하고
        Lambda 임시 저장소에 RAW CSV를 생성하는 Extract Lambda

      MemorySize: 2048

      Timeout: 900

      EphemeralStorage:
        Size: 1024

      Environment:
        Variables:

          # Lambda Root FileSystem 대신
          # 쓰기가 가능한 /tmp 영역 사용
          DATA_DIR: /tmp/data

          # Docker Image에서 생성한
          # Chromium / ChromeDriver 고정 실행 경로
          CHROMIUM_BINARY: /usr/local/bin/chromium

          CHROMEDRIVER_PATH: /usr/local/bin/chromedriver

          DATA_BUCKET_NAME: !Ref DataBucket

      Policies:

        - S3WritePolicy:
            BucketName: !Ref DataBucket

    Metadata:

      Dockerfile: Dockerfile.extract

      DockerContext: .

      DockerTag: extract-v1

  # ==========================================================
  # Transform Lambda
  # ==========================================================

  TransformFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName:
        runtrack-pipeline-transform

      CodeUri:
        .

      Handler:
        handlers.transform_handler.lambda_handler

      Runtime:
        python3.13

      Architectures:
        - x86_64

      Description: >
        S3 Raw 마라톤 일정 CSV를 전처리하여
        Processed CSV를 생성하는 Transform Lambda

      MemorySize:
        512

      Timeout:
        60

      Environment:
        Variables:

          DATA_DIR:
            /tmp/data

      Policies:

        - S3ReadPolicy:
            BucketName:
              !Ref DataBucket

        - S3WritePolicy:
            BucketName:
              !Ref DataBucket

  LoadFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName:
        runtrack-pipeline-load

      CodeUri:
        .

      Handler:
        handlers.load_handler.lambda_handler

      Runtime:
        python3.13

      Architectures:
        - x86_64

      Description: >
        S3 Processed 마라톤 일정 CSV를 다운로드하여
        Amazon RDS MySQL에 적재하는 Load Lambda

      MemorySize:
        512

      Timeout:
        120

      Environment:
        Variables:

          # Lambda 파일시스템은 /tmp 사용
          DATA_DIR:
            /tmp/data

          # RDS Endpoint
          DB_HOST:
            !Ref DbHost

          # RDS MySQL Port
          DB_PORT:
            !Ref DbPort

          # MySQL Database
          DB_NAME:
            !Ref DbName

          # RDS 관리형 Secrets Manager ARN
          DB_SECRET_ARN:
            !Ref DbSecretArn

      # ------------------------------------------------------
      # Load Lambda를 기존 RDS와 동일 VPC에 연결
      # ------------------------------------------------------

      VpcConfig:

        SecurityGroupIds:
          - !Ref LoadSecurityGroupId

        SubnetIds:
          - !Ref LoadSubnetId

      Policies:

        # ----------------------------------------------------
        # Lambda가 VPC ENI를 생성/관리할 수 있도록 권한 부여
        # ----------------------------------------------------

        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        # ----------------------------------------------------
        # S3 Processed CSV 다운로드
        # ----------------------------------------------------

        - S3ReadPolicy:
            BucketName:
              !Ref DataBucket

        # ----------------------------------------------------
        # Secrets Manager DB 자격 증명 조회
        # ----------------------------------------------------

        - Statement:

            - Sid:
                ReadDatabaseSecret

              Effect:
                Allow

              Action:
                - secretsmanager:GetSecretValue

              Resource:
                - !Ref DbSecretArn


# ============================================================
# Outputs
# ============================================================

Outputs:

  ExtractFunctionName:
    Description: RUNTRACK Extract Lambda Function Name
    Value: !Ref ExtractFunction

  ExtractFunctionArn:
    Description: RUNTRACK Extract Lambda Function ARN
    Value: !GetAtt ExtractFunction.Arn

  DataBucketName:
    Description: RUNTRACK Data Pipeline S3 Bucket Name
    Value: !Ref DataBucket
  
  LoadFunctionName:
    Description: RUNTRACK Load Lambda Function Name
    Value: !Ref LoadFunction

  LoadFunctionArn:
    Description: RUNTRACK Load Lambda Function ARN
    Value: !GetAtt LoadFunction.Arn